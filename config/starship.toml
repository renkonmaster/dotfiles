"$schema" = "https://starship.rs/config-schema.json"

format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
${custom.python_git}\
${custom.python_nongit}\
${custom.caboose_python}\
${custom.caboose_git}\
${custom.caboose_peach}\
$line_break\
$character"""

palette = "catppuccin_mocha"

[os]
disabled = false
style = "bg:red fg:crust"
# 左端の丸み
format = "[\uE0B6](fg:red)[$symbol](bg:red fg:crust)"

[os.symbols]
Windows = "\uE70F "
Ubuntu = "\uF31B "
SUSE = "\uF314 "
Raspbian = "\uF315 "
Mint = "\uF30E "
Macos = "\uF179 "
Manjaro = "\uF312 "
Linux = "\uF17C "
Gentoo = "\uF30D "
Fedora = "\uF30A "
Alpine = "\uF300 "
Amazon = "\uF270 "
Android = "\uE70E "
Arch = "\uF303 "
CentOS = "\uF304 "
Debian = "\uE77D "
Redhat = "\uF316 "
RedHatEnterprise = "\uF316 "

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
# ユーザー名からディレクトリへの繋ぎ目
format = "[$user ](bg:red fg:crust)[\uE0B0](fg:red bg:peach)"

[directory]
style = "bg:peach fg:crust"
format = "[ $path ](bg:peach fg:crust)"
truncation_length = 3
truncation_symbol = ".../"

[directory.substitutions]
"Documents" = "\uF02D "
"Downloads" = "\uF019 "
"Music" = "\uF025 "
"Pictures" = "\uF03E "
"Developer" = "\uF121 "

[git_branch]
symbol = "\uF418"
style = "bg:yellow fg:crust"
# ディレクトリからGitへの繋ぎ目
format = "[\uE0B0](fg:peach bg:yellow)[ $symbol $branch ](bg:yellow fg:crust)"

[git_status]
style = "bg:yellow fg:crust"
format = "[$all_status$ahead_behind ](bg:yellow fg:crust)"

[python]
disabled = true

[custom.python_git]
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -n \"$VIRTUAL_ENV\""
command = "basename \"$VIRTUAL_ENV\""
# GitからPythonへの繋ぎ目
format = "[\uE0B0](fg:yellow bg:green)[ \uE73C $output ](bg:green fg:crust)"

[custom.python_nongit]
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -n \"$VIRTUAL_ENV\""
command = "basename \"$VIRTUAL_ENV\""
# ディレクトリからPythonへの繋ぎ目
format = "[\uE0B0](fg:peach bg:green)[ \uE73C $output ](bg:green fg:crust)"

[custom.caboose_python]
when = "test -n \"$VIRTUAL_ENV\""
# 終端の丸み（Python表示時）
format = "[\uE0B4](fg:green)"

[custom.caboose_git]
when = "git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z \"$VIRTUAL_ENV\""
# 終端の丸み（Git表示時）
format = "[\uE0B4](fg:yellow)"

[custom.caboose_peach]
when = "! git rev-parse --is-inside-work-tree >/dev/null 2>&1 && test -z \"$VIRTUAL_ENV\""
# 終端の丸み（ディレクトリのみ表示時）
format = "[\uE0B4](fg:peach)"

[line_break]
disabled = false

[character]
disabled = false
success_symbol = "[>](bold fg:green)"
error_symbol = "[>](bold fg:red)"
vimcmd_symbol = "[<](bold fg:green)"
vimcmd_replace_one_symbol = "[<](bold fg:lavender)"
vimcmd_replace_symbol = "[<](bold fg:lavender)"
vimcmd_visual_symbol = "[<](bold fg:yellow)"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
