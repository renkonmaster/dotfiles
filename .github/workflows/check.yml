name: check

# Migration is deliberately unverified; run only when explicitly requested.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install zsh and mise
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
          curl --fail --show-error --silent --location https://mise.run -o /tmp/install-mise.sh
          sh /tmp/install-mise.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Check repository configuration
        run: |
          mise trust
          mise run check
